[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rigid-body-sysid"
version = "0.1.0"
description = "Genel rijit-govde sistem tanimlama araci"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pin>=2.7.0",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0.0"]
dev = ["pytest>=7.4.0"]

[tool.setuptools]
packages = ["src"]
