name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bagimliliklari kur
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sentetik ornek verisini yerine koy
        run: |
          cp examples/synthetic_3dof_arm/robot.urdf models/robot.urdf
          cp examples/synthetic_3dof_arm/trajectory_log.csv data/raw/trajectory_log.csv

      - name: Pipeline'i calistir
        run: python run_pipeline.py

      - name: Ground truth ile karsilastir
        run: python examples/synthetic_3dof_arm/compare_with_ground_truth.py

      - name: Birim testlerini calistir
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests/
